[package]
name = "vpnui-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "vpnui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
ratatui = "0.30.2"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-width = "0.2.2"
vpnui-proto = { version = "0.1.0", path = "../vpnui-proto" }

[dev-dependencies]
vpnui-mockd = { path = "../vpnui-mockd" }
